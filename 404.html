<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Página não encontrada — B&amp;B Contabilidade</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
      .error-page { min-height: 100svh; display: grid; place-items: center; padding: 2rem; color: var(--white); background: var(--green-950); text-align: center; }
      .error-page strong { display: block; color: var(--green-300); font-size: clamp(5rem, 20vw, 11rem); font-weight: 800; line-height: .8; }
      .error-page h1 { margin: 2rem 0 .75rem; font-family: Georgia, serif; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 400; }
      .error-page p { color: rgba(255,255,255,.75); }
      .error-page a { display: inline-block; margin-top: 1rem; padding: .9rem 1.4rem; color: var(--green-950); background: var(--white); border-radius: 999px; font-weight: 750; text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="error-page">
      <div>
        <strong aria-hidden="true">404</strong>
        <h1>Página não encontrada</h1>
        <p>O endereço pode ter mudado ou não estar mais disponível.</p>
        <a href="./">Voltar para o início</a>
      </div>
    </main>
  </body>
</html>
